<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Modifier une boulangerie</title>

    <link rel="stylesheet" th:href="@{/css/registration.css}">
</head>

<body>

<header>
    <h1>Paris Boulangeries App</h1>

    <a class="back-button"
       th:href="@{/bakery/{id}(id=${bakery.id})}">
        ← Retour
    </a>
</header>

<main>

    <div class="registration-card">

        <h2>Modifier une boulangerie</h2>

        <p class="registration-description">
            Modifiez les informations de la boulangerie.
        </p>

        <form id="editForm"
              th:object="${bakery}"
              th:action="@{/api/bakery/{id}/edit(id=${bakery.id})}"
              th:data-bakery-id="${bakery.id}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="_method"
                   value="PUT">

            <!-- Nom -->
            <div class="form-group">
                <label for="bakeryName">
                    Nom de la boulangerie <span class="required">*</span>
                </label>

                <input type="text"
                       id="bakeryName"
                       th:field="*{bakeryName}"
                       placeholder="Ex. Du Pain et des Idées"
                       required>
            </div>


            <!-- Arrondissement -->
            <div class="form-group">
                <label for="arrondissement">
                    Arrondissement <span class="required">*</span>
                </label>

                <select id="arrondissement"
                        th:field="*{arrondissement}"
                        required>

                    <option value="">Sélectionnez un arrondissement</option>

                    <option th:each="i : ${#numbers.sequence(1, 20)}"
                            th:value="${i}"
                            th:text="${i == 1
                            ? '1er arrondissement'
                            : i + 'e arrondissement'}">
                    </option>

                </select>
            </div>


            <!-- Adresse -->
            <div class="form-group">
                <label for="address">
                    Adresse
                </label>

                <input type="text"
                       id="address"
                       th:field="*{address}"
                       placeholder="Ex. 34 Rue du Faubourg Saint-Martin">
            </div>


            <!-- Rating -->
            <div class="form-group">
                <label for="rating">
                    Évaluation <span class="required">*</span>
                </label>

                <select id="rating"
                        th:field="*{rating}"
                        required>

                    <option value="">Sélectionnez une note</option>
                    <option value="1.0">1.0</option>
                    <option value="1.5">1.5</option>
                    <option value="2.0">2.0</option>
                    <option value="2.5">2.5</option>
                    <option value="3.0">3.0</option>
                    <option value="3.5">3.5</option>
                    <option value="4.0">4.0</option>
                    <option value="4.5">4.5</option>
                    <option value="5.0">5.0</option>

                </select>
            </div>


            <!-- Notes -->
            <div class="form-group">
                <label for="notes">
                    Notes
                </label>

                <textarea id="notes"
                          th:field="*{notes}"
                          placeholder="Ajoutez vos impressions..."></textarea>
            </div>


            <!-- Favorite -->
            <div class="favorite-group">

                <input type="checkbox"
                       id="favorite"
                       th:field="*{favorite}">

                <label for="favorite">
                    Ajouter aux favoris
                </label>

            </div>


            <!-- Visited date -->
            <div class="form-group">
                <label for="visitedDate">
                    Date de visite <span class="required">*</span>
                </label>

                <input type="date"
                       id="visitedDate"
                       name="visitedDate"
                       th:value="${#temporals.format(
                       bakery.visitedDate,
                       'yyyy-MM-dd'
                   )}"
                       required>
            </div>


            <!-- Current photo -->
            <div class="form-group">

                <label>
                    Photo actuelle
                </label>

                <div class="current-photo">

                    <img th:if="${bakery.photoUrl != null}"
                         th:src="@{/uploads/{filename}(filename=${bakery.photoUrl})}"
                         alt="Photo actuelle">

                    <span th:if="${bakery.photoUrl == null}">
                    Aucune photo
                </span>

                </div>

            </div>


            <!-- New photo -->
            <div class="form-group">

                <label>
                    Modifier la photo
                </label>

                <div class="photo-upload">

                    <input type="file"
                           id="photo"
                           th:field="*{photo}"
                           hidden>

                    <label for="photo"
                           class="file-button">

                        <span>Choisir une photo</span>

                        <img src="/images/clarity_upload-line.svg"
                             alt="Upload">

                    </label>

                    <span id="file-name">
                    Aucune nouvelle photo sélectionnée
                </span>

                </div>

            </div>


            <!-- Google Maps -->
            <div class="form-group">
                <label for="mapsUrl">
                    Lien Google Maps
                </label>

                <input type="url"
                       id="mapsUrl"
                       th:field="*{mapsUrl}"
                       placeholder="https://maps.google.com/...">
            </div>


            <!-- Submit -->
            <div class="submit-area">

                <button type="submit"
                        class="submit-button">

                    Modifier

                </button>

            </div>

        </form>

    </div>

</main>
<script th:src="@{/js/edit.js}"></script>

</body>
</html>
